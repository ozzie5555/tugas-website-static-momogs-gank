<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontak – Momog</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <!-- CSS Lokal -->
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    /* Layout Khusus Kontak */
    .kontak-layout {
      display: flex;
      gap: 50px;
      margin-top: 40px;
    }

    .form-section, .info-section {
      flex: 1;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #1A1A1A;
    }

    .form-control {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: 'Open Sans', sans-serif;
      font-size: 1rem;
    }

    textarea.form-control {
      min-height: 120px;
      resize: vertical;
    }

    .btn-submit {
      background-color: #6B8E23;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-family: 'Open Sans', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #5a7a1f;
    }

    .contact-item {
      margin-bottom: 16px;
    }

    .contact-label {
      font-weight: 600;
      color: #6B8E23;
      display: block;
      margin-bottom: 4px;
    }

    /* Responsive */
    @media (max-width: 968px) {
      .kontak-layout {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand-logo">
      <img src="assets/images/logo.png" alt="Momog" class="navbar-logo">
    </a>
    <ul class="nav-menu">
      <li><a href="index.html">BERANDA</a></li>
      <li><a href="about.html">TENTANG</a></li>
      <li><a href="destinasi.html">DESTINASI</a></li>
      <li><a href="kuliner.html">KULINER</a></li>
      <li><a href="kontak.html" class="active">KONTAK</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="container">
    <h2>Kontak Kami</h2>

    <div class="kontak-layout">
      <!-- Formulir -->
      <section class="form-section section-white">
        <h3>Kirim Pesan</h3>
        <form id="contactForm">
          <div class="form-group">
            <label for="name">Nama</label>
            <input type="text" id="name" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="message">Pesan</label>
            <textarea id="message" class="form-control" required></textarea>
          </div>
          <button type="submit" class="btn-submit">Kirim Pesan</button>
        </form>
      </section>

      <!-- Info Kontak -->
      <section class="info-section section-white">
        <h3>Informasi Kontak</h3>
        <div class="contact-item">
          <span class="contact-label">Alamat</span>
          <p>Semarang, Jawa Tengah, Indonesia</p>
        </div>
        <div class="contact-item">
          <span class="contact-label">Email</span>
          <p>momogsemarang999@gmail.com</p>
        </div>
        <div class="contact-item">
          <span class="contact-label">Telepon</span>
          <p>+62 816-6088-8806</p>
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 Community Momog's Concordia. All rights reserved.</p>
  </footer>

  <!-- JavaScript Ringan (Opsional: Tampilkan pesan sukses) -->
  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Terima kasih! Pesan Anda telah diterima.\n(Simulasi: data tidak dikirim karena ini website statis.)');
      this.reset();
    });
  </script>
</body>
</html>
